<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Works</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    />
</head>
<body>
    <main>
        <header class="explore">
            <div class="explore-text">
                <h1>Explore Art Work</h1>
            </div>

            <div class="see-all">
                <h2>See All</h2>
            </div>
        </header>

        <section class="arts-cards">
            <div class="card1">
                <img src="./bd0a922b14b9cce1da868e29a45f8e62.jpg" alt="monocular">
                <div class="reactions">
                    <h3 class="name">Monocular</h3>
                    <div class="reaction-img">
                        <span>54.0k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            <div class="card2">
                <img src="./images (5).jpg" alt="homs mask">
                <div class="reactions">
                    <h3 class="name">Homs Mask</h3>
                    <div class="reaction-img">
                        <span>32.4k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            <div class="card3">
                <img src="./9aecc14e8215fc5d954d4f45512c2c65.jpg" alt="light moon">
                <div class="reactions">
                    <h3 class="name">Light Moon</h3>
                    <div class="reaction-img">
                        <span>86.6k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            <div class="card4">
                <img src="./4b8c2229d092240bdbe16b8bc7940356.jpg" alt="skull wire">
                <div class="reactions">
                    <h3 class="name">Skull Wire</h3>
                    <div class="reaction-img">
                        <span>78.9k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            <div class="card5">
                <img src="./897bee3eb6ef183d968f577d440ff142.jpg" alt="spiderman">
                <div class="reactions">
                    <h3 class="name">Spiderman</h3>
                    <div class="reaction-img">
                        <span>24.8k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            <div class="card6">
                <img src="./222f1aecde4d27072809bad6a9dce6b5.jpg" alt="deadpool">
                <div class="reactions">
                    <h3 class="name">DeadPool</h3>
                    <div class="reaction-img">
                        <span>56.7k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            <div class="card7">
                <img src="./72ef9a91b0b739fd94d143b07a5988f8.jpg" alt="white eyes">
                <div class="reactions">
                    <h3 class="name">White Eyes</h3>
                    <div class="reaction-img">
                        <span>45.7k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
            <div class="card8">
                <img src="./7c4908147c4c620726852661e3dac49e.jpg" alt="plastic spinal">
                <div class="reactions">
                    <h3 class="name">Plastic Spinal</h3>
                    <div class="reaction-img">
                        <span>95.6k</span>
                        <i class="ri-heart-line"></i>
                    </div>
                </div>
                <button class="bid-btn">Place Bid</button>
            </div>
        </section>
    </main>
</body>
</html>
